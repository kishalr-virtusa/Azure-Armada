<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — DR Sentinel Console</title>
    <link rel="icon" type="image/svg+xml" href="/static/brand/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/virtusa.css">
    <style>
        .login-wrap {
            position: relative;
            overflow: hidden;
        }
        /* (watermark removed: branding lives in the header) */
        .login-wrap::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 600px;
            height: 200px;
            background: none;
            background-size: contain;
            opacity: 0.03;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        @media (prefers-color-scheme: dark) {
            .login-wrap::before {
                background-image: none;
                opacity: 0.04;
            }
        }
        .brand-section {
            margin-bottom: 24px;
        }
        .brand-logo-container {
            margin-bottom: 16px;
        }
        .brand-logo-light { display: inline; }
        .brand-logo-dark { display: none; }
        @media (prefers-color-scheme: dark) {
            .brand-logo-light { display: none; }
            .brand-logo-dark { display: inline; }
        }
        .azure-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: var(--surface-2);
            border-radius: 6px;
            font-size: 11px;
            color: var(--ink-3);
        }
    </style>
</head>
<body>
    <div class="login-wrap">
        <div class="card login-card">
            <div class="brand-section">
                <span aria-hidden="true" style="width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; color: #fff; background: linear-gradient(135deg, #5e2cfe, #c105b2); box-shadow: 0 6px 16px rgba(94, 44, 254, .3); margin-bottom: 16px;"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7.5 3v5.5c0 4.7-3.2 8.3-7.5 9.5-4.3-1.2-7.5-4.8-7.5-9.5V6z"/><path d="M8.8 12.2l2.2 2.2 4.4-4.6"/></svg></span>
                <span class="eyebrow">Azure Day 2026</span>
                <h1 style="margin-top: 8px;">DR Sentinel</h1>
                <p class="sub" style="margin-bottom: 16px;">Autonomous Disaster Recovery Validation</p>
                <div class="azure-badge">
                    <img src="/static/brand/azure.svg" alt="Azure" style="height: 16px;">
                    <span>Built on Microsoft Azure</span>
                </div>
            </div>
            
            <p class="sub" style="margin-bottom: 16px;">Enter the console passcode to continue</p>
            
            {% if error %}
            <div class="box" style="background: var(--add-bg); border-color: var(--add); color: var(--add); margin-bottom: 16px;">
                {{ error }}
            </div>
            {% endif %}
            
            <form method="POST" action="/login" style="display: flex; flex-direction: column; gap: 12px;">
                <div class="form-group">
                    <input type="password" 
                           name="passcode" 
                           class="form-input" 
                           placeholder="Passcode"
                           autofocus
                           required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    Sign In
                </button>
            </form>
            
            <div style="margin-top: 24px; text-align: center; font-size: 11px; color: var(--ink-3);">
                Team Azure Armada
            </div>
        </div>
    </div>
</body>
</html>
